<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">How Privacy CI works</title>
  <desc id="d">Your repository is read by privacy:discover, which produces a findings manifest. Your GDPR policy as code feeds the same manifest. From the manifest, privacy:check gates CI, and privacy:make-handler generates deletion code that privacy:forget executes and privacy:verify proves.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .cmd  { font-size: 15px; font-weight: 600; }
      .long { font-size: 13.5px; }
      .note { font-size: 12px; fill: #8b949e; }
      .item { font-size: 14px; fill: #c9d1d9; }
      .cap  { font-size: 11px; fill: #8b949e; letter-spacing: 1.2px; }
      .edge { stroke: #6e7681; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
  </defs>

  <rect width="960" height="430" rx="10" fill="#0d1117"/>

  <!-- sources -->
  <rect x="28" y="56" width="216" height="190" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="sans cap" x="44" y="82">YOUR REPOSITORY</text>
  <text class="sans note" x="44" y="100">read, never executed</text>
  <text class="mono item" x="44" y="132">migrations</text>
  <text class="mono item" x="44" y="156">models</text>
  <text class="mono item" x="44" y="180">config/</text>
  <text class="mono item" x="44" y="204">composer.lock</text>
  <text class="mono item" x="44" y="228">app/ source</text>

  <!-- discover -->
  <rect x="288" y="119" width="176" height="64" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text class="mono cmd" x="376" y="146" fill="#56d364" text-anchor="middle">privacy:discover</text>
  <text class="sans note" x="376" y="166" text-anchor="middle">no database, no secrets</text>

  <!-- manifest -->
  <rect x="508" y="119" width="176" height="64" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text class="sans cmd" x="596" y="146" fill="#58a6ff" text-anchor="middle">findings manifest</text>
  <text class="sans note" x="596" y="166" text-anchor="middle">structure, never values</text>

  <!-- policy -->
  <rect x="508" y="250" width="176" height="70" rx="8" fill="#161b22" stroke="#bc8cff"/>
  <text class="sans cmd" x="596" y="277" fill="#bc8cff" text-anchor="middle">your GDPR policy</text>
  <text class="sans note" x="596" y="297" text-anchor="middle">as code, in the repository</text>

  <!-- outputs -->
  <rect x="728" y="56" width="200" height="64" rx="8" fill="#161b22" stroke="#f85149"/>
  <text class="mono cmd" x="828" y="83" fill="#ff7b72" text-anchor="middle">privacy:check</text>
  <text class="sans note" x="828" y="103" text-anchor="middle">CI gate, exit 1</text>

  <rect x="728" y="160" width="200" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="mono cmd long" x="828" y="187" fill="#c9d1d9" text-anchor="middle">privacy:make-handler</text>
  <text class="sans note" x="828" y="207" text-anchor="middle">deletion code</text>

  <rect x="728" y="244" width="200" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <text class="mono cmd" x="828" y="271" fill="#c9d1d9" text-anchor="middle">privacy:forget</text>
  <text class="sans note" x="828" y="291" text-anchor="middle">suspend, then erase</text>

  <rect x="728" y="328" width="200" height="64" rx="8" fill="#161b22" stroke="#d29922"/>
  <text class="mono cmd" x="828" y="355" fill="#e3b341" text-anchor="middle">privacy:verify</text>
  <text class="sans note" x="828" y="375" text-anchor="middle">proof of erasure</text>

  <!-- edges -->
  <path class="edge" d="M244 151 H282"/>
  <path class="edge" d="M464 151 H502"/>
  <path class="edge" d="M596 250 V189"/>
  <path class="edge" d="M684 143 C706 143 706 88 722 88"/>
  <path class="edge" d="M684 159 C706 159 706 192 722 192"/>
  <path class="edge" d="M828 224 V238"/>
  <path class="edge" d="M828 308 V322"/>
</svg>
